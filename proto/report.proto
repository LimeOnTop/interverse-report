syntax = "proto3";

package report;

option go_package = "github.com/inter-verse/report-service/gen";

// Common response wrapper
message Response {
  bool success = 1;
  string message = 2;
  string error = 3;
}

// Pagination
message Pagination {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
}

// Report service definition
service ReportService {
  rpc CreateReport(CreateReportRequest) returns (CreateReportResponse);
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  rpc UpdateReport(UpdateReportRequest) returns (UpdateReportResponse);
  rpc DeleteReport(DeleteReportRequest) returns (Response);
  rpc GetReports(GetReportsRequest) returns (GetReportsResponse);
}

// Report entity
message Report {
  string id = 1;
  string interview_id = 2;
  string candidate_id = 3;
  string interviewer_id = 4;
  string overall_rating = 5;
  string technical_skills = 6;
  string communication_skills = 7;
  string problem_solving = 8;
  string strengths = 9;
  string weaknesses = 10;
  string recommendations = 11;
  string notes = 12;
  string created_at = 13;
  string updated_at = 14;
}

// Create Report
message CreateReportRequest {
  string interview_id = 1;
  string candidate_id = 2;
  string interviewer_id = 3;
  string overall_rating = 4;
  string technical_skills = 5;
  string communication_skills = 6;
  string problem_solving = 7;
  string strengths = 8;
  string weaknesses = 9;
  string recommendations = 10;
  string notes = 11;
}

message CreateReportResponse {
  Response response = 1;
  Report report = 2;
}

// Get Report
message GetReportRequest {
  string report_id = 1;
}

message GetReportResponse {
  Response response = 1;
  Report report = 2;
}

// Update Report
message UpdateReportRequest {
  string report_id = 1;
  string overall_rating = 2;
  string technical_skills = 3;
  string communication_skills = 4;
  string problem_solving = 5;
  string strengths = 6;
  string weaknesses = 7;
  string recommendations = 8;
  string notes = 9;
}

message UpdateReportResponse {
  Response response = 1;
  Report report = 2;
}

// Delete Report
message DeleteReportRequest {
  string report_id = 1;
}

// Get Reports
message GetReportsRequest {
  string interviewer_id = 1;
  Pagination pagination = 2;
}

message GetReportsResponse {
  Response response = 1;
  repeated Report reports = 2;
  Pagination pagination = 3;
}
